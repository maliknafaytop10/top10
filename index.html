<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAFAY & TEAMS | MALIK NAFAY STUDIO OFFICIAL NETWORK V4</title>
    <style>
        /* ==========================================================================
           1. PREMIUM INDUSTRIAL CORE ARCHITECTURE & VARIABLE INJECTION
           ========================================================================== */
        :root {
            --bg-master-dark: #020106;
            --bg-gradient-start: #05020c;
            --bg-gradient-mid: #0d111d; /* Deep Metallic Slate Charcoal */
            --bg-gradient-end: #070a12;
            --accent-neon-blue: #3b82f6;
            --accent-neon-glow: #2563eb;
            --accent-purple-glow: #9333ea;
            --accent-pink-devotion: #f472b6;
            --industrial-gray-light: #cbd5e1;
            --industrial-gray-mid: #64748b;
            --industrial-gray-dark: #1e293b;
            --industrial-slate-solid: #0f172a;
            --text-ultra-white: #ffffff;
            --text-clean-muted: #94a3b8;
            --cyber-grid-line: rgba(148, 163, 184, 0.05);
            --interface-glass-bg: rgba(15, 23, 42, 0.65);
            --interface-border-glow: rgba(59, 130, 246, 0.25);
            --neon-shadow: 0 0 25px rgba(59, 130, 246, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-master-dark);
            background-image: 
                linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            color: var(--text-ultra-white);
            overflow-x: hidden;
        }

        /* Fluid Industrial Webkit Navigation Scrollbar Layout */
        ::-webkit-scrollbar {
            width: 14px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-master-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #1e293b, var(--accent-neon-blue), #9333ea, #64748b);
            border-radius: 7px;
            border: 3px solid var(--bg-master-dark);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, var(--accent-neon-blue), var(--accent-pink-devotion));
        }

        /* ==========================================================================
           2. INTERACTIVE CYBERNETIC MESH GRID SYSTEM
           ========================================================================== */
        .cyber-mesh-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, var(--cyber-grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--cyber-grid-line) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
            pointer-events: none;
        }

        .cyber-mesh-grid::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 20%, var(--bg-master-dark) 95%);
        }

        .ambient-glow-orbs {
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            top: -300px;
            left: -300px;
            z-index: 2;
            pointer-events: none;
            animation: floatingGlowOne 12s infinite alternate ease-in-out;
        }

        .ambient-glow-orbs-two {
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.08) 0%, transparent 70%);
            bottom: -250px;
            right: -250px;
            z-index: 2;
            pointer-events: none;
            animation: floatingGlowTwo 15s infinite alternate ease-in-out;
        }

        @keyframes floatingGlowOne {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(150px, 80px) scale(1.2); }
        }
        @keyframes floatingGlowTwo {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-100px, -90px) scale(1.1); }
        }

        /* ==========================================================================
           3. MASTER INDUSTRIAL GLASSMORPHIC HEADER PANEL
           ========================================================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 35px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(2, 1, 6, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header.scrolled {
            padding: 20px 80px;
            background: rgba(15, 23, 42, 0.98);
            border-bottom: 2px solid var(--accent-neon-blue);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
        }

        .network-brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-ultra-white);
            cursor: pointer;
        }

        .network-brand-title span {
            color: var(--accent-neon-blue);
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav a {
            color: var(--text-clean-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            padding: 6px 0;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(to right, var(--accent-neon-blue), var(--industrial-gray-light));
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--text-ultra-white);
        }

        nav a:hover::after {
            width: 100%;
        }

        .navigation-action-trigger {
            background: var(--industrial-gray-dark);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-ultra-white);
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .navigation-action-trigger:hover {
            background: var(--industrial-gray-light);
            color: var(--bg-master-dark);
            transform: translateY(-2px);
        }

        .navigation-action-trigger.highlight-btn {
            background: var(--accent-neon-blue);
            border-color: var(--accent-neon-blue);
        }

        .navigation-action-trigger.highlight-btn:hover {
            background: var(--accent-neon-glow);
            box-shadow: var(--neon-shadow);
        }

        .navigation-action-trigger.emergency-trigger-btn {
            background: #ef4444;
            border-color: #ef4444;
        }
        
        .navigation-action-trigger.emergency-trigger-btn:hover {
            background: #dc2626;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            color: white;
        }

        /* ==========================================================================
           4. HERO LANDING ENGINE (CLEAN MATRIX BLOCK WITHOUT TOP BANNER)
           ========================================================================== */
        .viewport-master-pipeline {
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .hero-view-module {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 200px 20px 100px 20px;
        }

        .studio-version-tag {
            background: var(--industrial-gray-dark);
            border: 1px solid var(--industrial-gray-mid);
            color: var(--industrial-gray-light);
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        .hero-large-title {
            font-size: 115px;
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -3px;
            text-transform: uppercase;
            color: var(--text-ultra-white);
            margin-bottom: 30px;
            background: linear-gradient(to bottom, #ffffff 50%, var(--text-clean-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-extra-subtitle {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-neon-blue);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 70px;
        }

        /* Metrics Display Grid */
        .performance-matrix-container {
            display: grid;
            grid-template-columns: repeat(4, 190px);
            gap: 25px;
        }

        .matrix-metric-node {
            background: var(--industrial-slate-solid);
            border: 1px solid var(--industrial-gray-dark);
            padding: 35px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .matrix-metric-node:hover {
            border-color: var(--accent-neon-blue);
            transform: translateY(-5px);
            box-shadow: var(--neon-shadow);
        }

        .matrix-metric-node h3 {
            font-size: 38px;
            font-weight: 900;
            color: var(--text-ultra-white);
            margin-bottom: 5px;
        }

        .matrix-metric-node p {
            font-size: 11px;
            color: var(--industrial-gray-light);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ==========================================================================
           5. VISUAL PORTRAIT GALLERY STATION
           ========================================================================== */
        .media-showcase-section {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 40px;
            text-align: center;
        }

        .gallery-header {
            margin-bottom: 70px;
        }

        .gallery-header h2 {
            font-size: 44px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .gallery-header p {
            color: var(--industrial-gray-mid);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .brand-visual-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .visual-card-frame {
            background: var(--industrial-slate-solid);
            border: 1px solid var(--industrial-gray-dark);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
        }

        .visual-card-frame:hover {
            border-color: var(--accent-purple-glow);
            transform: translateY(-5px);
        }

        .visual-card-frame img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
            display: block;
        }

        .visual-caption {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .visual-caption span {
            color: var(--accent-neon-blue);
        }

        /* ==========================================================================
           6. COMPREHENSIVE SPLIT STRUCTURAL CONTENT BLOCKS
           ========================================================================== */
        .structural-section-divider {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--industrial-gray-dark), transparent);
        }

        .portal-content-section {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 130px 40px;
        }

        .split-grid-layout {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 80px;
            align-items: start;
        }

        .section-identity-panel h2 {
            font-size: 46px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .section-identity-panel p {
            color: var(--accent-neon-blue);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .premium-text-terminal {
            background: var(--interface-glass-bg);
            border: 1px solid var(--industrial-gray-dark);
            padding: 60px;
            border-radius: 24px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
        }

        .premium-text-terminal p {
            color: var(--industrial-gray-light);
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 30px;
            text-align: justify;
        }

        .premium-text-terminal p strong {
            color: var(--text-ultra-white);
        }

        /* ==========================================================================
           7. DEMAND COMPONENT 1: COMPREHENSIVE DONATION GATEWAY FRAME
           ========================================================================== */
        .donation-tab-system {
            margin-top: 35px;
        }

        .donation-tab-headers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-select-trigger {
            background: var(--industrial-slate-solid);
            border: 1px solid var(--industrial-gray-dark);
            padding: 16px;
            border-radius: 8px;
            color: var(--text-ultra-white);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-select-trigger.active-tab, .tab-select-trigger:hover {
            background: var(--accent-neon-blue);
            border-color: var(--accent-neon-blue);
            box-shadow: var(--neon-shadow);
        }

        .donation-card-body-wrapper {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 40px 35px;
            border-radius: 16px;
            text-align: left;
        }

        .crypto-wallet-field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--industrial-slate-solid);
            padding: 16px 24px;
            border-radius: 10px;
            border: 1px solid var(--industrial-gray-dark);
            margin-top: 15px;
        }

        .wallet-string-hash {
            font-family: 'Courier New', Courier, monospace;
            color: var(--industrial-gray-light);
            font-size: 14px;
            font-weight: bold;
        }

        .copy-action-indicator {
            color: var(--accent-neon-blue);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* ==========================================================================
           8. DEMAND COMPONENT 2: SECURE EMERGENCY HELP TERMINAL
           ========================================================================== */
        .emergency-form-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .grid-dual-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .terminal-field-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .terminal-field-container label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--industrial-gray-light);
            text-transform: uppercase;
        }

        .terminal-input-node {
            width: 100%;
            padding: 18px 24px;
            background: var(--industrial-slate-solid);
            border: 1px solid var(--industrial-gray-dark);
            border-radius: 10px;
            color: var(--text-ultra-white);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .terminal-input-node:focus {
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }

        .terminal-textarea-node {
            height: 140px;
            resize: none;
        }

        .submit-emergency-trigger {
            background: #ef4444;
            border: none;
            padding: 18px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-emergency-trigger:hover {
            background: #dc2626;
            box-shadow: 0 12px 30px rgba(239, 68, 68, 0.4);
            transform: translateY(-2px);
        }

        /* ==========================================================================
           9. DEMAND COMPONENT 3: SECURE REPLIES CONTACT TERMINAL
           ========================================================================== */
        .contact-execution-panel {
            margin-top: 35px;
        }

        .contact-grid-deck {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .contact-channel-node {
            background: var(--industrial-slate-solid);
            border: 1px solid var(--industrial-gray-dark);
            padding: 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .channel-graphic-icon {
            width: 50px;
            height: 50px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-neon-blue);
            font-weight: 900;
            font-size: 20px;
        }

        .channel-metadata-block h5 {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .channel-metadata-block p {
            font-size: 13px;
            color: var(--industrial-gray-light);
            margin-bottom: 0;
            text-align: left;
        }

        /* ==========================================================================
           10. SOCIAL CHANNELS INTERFACE DISPLAY DECK
           ========================================================================== */
        .social-linkage-showcase {
            margin-top: 45px;
            border-top: 1px solid var(--industrial-gray-dark);
            padding-top: 40px;
        }

        .social-linkage-showcase h4 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
            font-weight: 800;
        }

        .social-gateway-deck {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .social-gateway-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--industrial-slate-solid);
            border: 1px solid var(--industrial-gray-dark);
            padding: 20px 30px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-gateway-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-neon-blue);
        }

        .social-card-meta .platform-label {
            color: var(--text-ultra-white);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .social-card-meta .handle-identity {
            color: var(--industrial-gray-light);
            font-size: 12px;
        }

        .social-card-action-pointer {
            font-size: 20px;
            color: var(--accent-neon-blue);
        }

        /* ==========================================================================
           11. ACCORDION FAQ CONTROLS DEPLOYMENT MODULE
           ========================================================================== */
        .faq-section-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .faq-accordion-item {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--industrial-gray-dark);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .faq-accordion-trigger {
            width: 100%;
            padding: 22px 25px;
            background: transparent;
            border: none;
            color: var(--text-ultra-white);
            text-align: left;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            outline: none;
        }

        .faq-accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .faq-accordion-content p {
            padding: 25px;
            color: var(--industrial-gray-light);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 0;
            text-align: left;
        }

        .faq-accordion-item.active-panel {
            border-color: var(--accent-neon-blue);
            background: var(--industrial-slate-solid);
        }

        .faq-accordion-item.active-panel .faq-accordion-content {
            max-height: 250px;
        }

        .faq-icon-marker {
            font-size: 18px;
            color: var(--accent-neon-blue);
            transition: transform 0.3s ease;
        }

        .faq-accordion-item.active-panel .faq-icon-marker {
            transform: rotate(45deg);
        }

        /* ==========================================================================
           12. DEMAND UPGRADE: REALIGNING DEVOTION BANNER AT THE END OF CORE DATA
           ========================================================================== */
        .end-devotion-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid var(--industrial-gray-dark);
        }

        .mother-devotion-banner {
            background: linear-gradient(90deg, rgba(15, 23, 42, 0.8) 0%, rgba(147, 51, 234, 0.1) 50%, rgba(15, 23, 42, 0.8) 100%);
            border: 2px solid var(--accent-pink-devotion);
            padding: 28px 100px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(244, 114, 182, 0.15);
            transform: skewX(-8deg);
            animation: pulseGlowBorder 2s infinite alternate;
        }

        @keyframes pulseGlowBorder {
            0% { border-color: rgba(244, 114, 182, 0.4); box-shadow: 0 10px 30px rgba(244, 114, 182, 0.1); }
            100% { border-color: rgba(244, 114, 182, 1); box-shadow: 0 20px 50px rgba(244, 114, 182, 0.35); }
        }

        .mother-devotion-banner h2 {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--text-ultra-white);
            text-shadow: 0 0 25px rgba(244, 114, 182, 0.8);
            transform: skewX(8deg);
        }

        /* ==========================================================================
           13. MASTER TERMINAL FOOTER DEPLOYMENT
           ========================================================================== */
        footer {
            width: 100%;
            padding: 80px 20px;
            text-align: center;
            border-top: 1px solid var(--industrial-gray-dark);
            background: #05080f;
            position: relative;
            z-index: 10;
        }

        .footer-brand-signature {
            font-size: 14px;
            color: var(--accent-neon-blue);
            font-weight: 700;
            letter-spacing: 5px
